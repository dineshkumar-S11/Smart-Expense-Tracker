
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Smart Expense Tracker</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #063b2e, #0b7a4f);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 55px #002a1d55;
        }

        .logo {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            background: #e3f4ea;
            color: #087849;
            border-radius: 16px;
            font-size: 30px;
            margin-bottom: 20px;
        }

        h1 { margin: 0 0 8px; color: #12382b; font-size: 28px; }
        .subtitle { color: #738078; margin: 0 0 25px; }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
            color: #34463d;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce5df;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0b7a4f;
            box-shadow: 0 0 0 3px #0b7a4f18;
        }

        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 65px; }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: none;
            color: #087849;
            cursor: pointer;
        }

        .submit {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: 0;
            border-radius: 10px;
            background: #0b7a4f;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit:hover { background: #086540; }
        .submit:disabled { opacity: .65; cursor: wait; }

        .message { margin-top: 15px; font-size: 14px; line-height: 1.5; }

        .login {
            margin-top: 22px;
            text-align: center;
            color: #738078;
            font-size: 14px;
        }

        a { color: #087849; text-decoration: none; font-weight: 700; }
        a:hover { text-decoration: underline; }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #738078;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo">₹</div>

        <h1>Create account</h1>
        <p class="subtitle">Start managing your money smarter.</p>

        <form id="registerForm">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text"
                   placeholder="Enter your name"
                   autocomplete="name" maxlength="100" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   placeholder="you@example.com"
                   autocomplete="email" maxlength="190" required>

            <label for="password">Password</label>
            <div class="password-wrap">
                <input id="password" name="password" type="password"
                       placeholder="At least 8 characters"
                       autocomplete="new-password"
                       minlength="8" maxlength="128" required>
                <button class="toggle" type="button"
                        data-target="password">Show</button>
            </div>

            <label for="confirmPassword">Confirm password</label>
            <div class="password-wrap">
                <input id="confirmPassword" name="confirmPassword"
                       type="password" placeholder="Re-enter password"
                       autocomplete="new-password" minlength="8" required>
                <button class="toggle" type="button"
                        data-target="confirmPassword">Show</button>
            </div>

            <button class="submit" id="submitBtn" type="submit">
                Create Account
            </button>

            <div class="message" id="message"
                 role="status" aria-live="polite"></div>
        </form>

        <div class="login">
            Already have an account? <a href="/login">Sign in</a>
        </div>

    </main>

    <script>
        document.querySelectorAll('.toggle').forEach(button => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                button.textContent = show ? 'Hide' : 'Show';
            });
        });

        document.getElementById('registerForm').addEventListener('submit', async event => {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('message');
            const button = document.getElementById('submitBtn');

            message.style.color = '#b42318';
            message.textContent = '';
            let redirecting = false;

            if (name.length < 2) {
                message.textContent = 'Please enter your full name.';
                return;
            }

            if (password.length < 8) {
                message.textContent = 'Password must contain at least 8 characters.';
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = 'Passwords do not match.';
                return;
            }

            button.disabled = true;
            button.textContent = 'Creating account...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, confirmPassword })
                });

                const result = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(
                        result.message || result.error || 'Registration failed.'
                    );
                }

                message.style.color = '#087849';
                message.textContent = 'Account created! Taking you to the login page...';

                // Registration does not log you in - go to the login page.
                redirecting = true;
                window.location.replace('/login?registered=1');
            } catch (error) {
                message.textContent = error instanceof TypeError
                    ? 'Unable to connect to the server.'
                    : (error.message || 'Registration failed.');
            } finally {
                if (!redirecting) {
                    button.disabled = false;
                    button.textContent = 'Create Account';
                }
            }
        });
    </script>
</body>
</html>
